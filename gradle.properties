org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# 2048m was tight for a Kotlin K2 + Compose-compiler build and could cause
# daemon GC thrashing, especially with Android Studio's own JVM competing
# for memory on the same machine. The three flags below are standard,
# low-risk Gradle 8.9/AGP 8.7 speedups: parallel task execution, build
# output caching so unchanged tasks are skipped/reused, and configuration
# cache so the build scripts aren't re-evaluated on every invocation.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
